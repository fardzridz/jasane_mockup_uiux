<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JASAne — Splash Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root {
      --primary: #0084FF;
      --primary-light: #4DA6FF;
      --primary-surface: #E8F4FF;
      --primary-dark: #0060BB;
      --bg-primary: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { font-family: 'Inter', sans-serif; background: var(--bg-primary); height: 100%; width: 100%; overflow: hidden; -webkit-font-smoothing: antialiased; }
    .device { width: 100%; height: 100%; max-width: 430px; margin: 0 auto; background: var(--bg-primary); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    /* Background gradient circles */
    .bg-circle {
      position: absolute; border-radius: 50%; opacity: 0;
      animation: bgPulse 2.5s ease-out forwards; pointer-events: none;
    }
    .bg-circle.c1 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(0,132,255,0.06) 0%, transparent 70%); top: -60px; left: -60px; animation-delay: 0.3s; }
    .bg-circle.c2 { width: 280px; height: 280px; background: radial-gradient(circle, rgba(0,132,255,0.05) 0%, transparent 70%); bottom: -50px; right: -50px; animation-delay: 0.5s; }
    @keyframes bgPulse { 0% { opacity:0; transform:scale(0.6) } 100% { opacity:1; transform:scale(1) } }

    /* Logo container */
    .logo-wrap { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }

    /* Logo icon - animated */
    .logo-icon {
      width: 96px; height: 96px; border-radius: 28px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 40px rgba(0,132,255,0.3);
      opacity: 0; transform: scale(0) rotate(-180deg);
      animation: logoSpin 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: 0.2s;
    }
    @keyframes logoSpin {
      0% { opacity: 0; transform: scale(0) rotate(-180deg); }
      60% { opacity: 1; transform: scale(1.1) rotate(10deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* Inner icon pulse */
    .logo-inner {
      font-size: 44px; color: #fff;
      animation: iconBounce 0.4s ease forwards;
      animation-delay: 0.8s;
      opacity: 0; transform: scale(0);
    }
    @keyframes iconBounce {
      0% { opacity: 0; transform: scale(0); }
      50% { transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Ring burst */
    .ring-burst {
      position: absolute; width: 96px; height: 96px; border-radius: 28px;
      border: 3px solid var(--primary); opacity: 0;
      animation: ringExpand 0.8s ease-out forwards;
      animation-delay: 0.7s;
    }
    @keyframes ringExpand {
      0% { opacity: 0.8; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.8); border-radius: 50%; }
    }

    /* Particles */
    .particles { position: absolute; width: 200px; height: 200px; }
    .particle {
      position: absolute; width: 8px; height: 8px; border-radius: 50%;
      background: var(--primary); opacity: 0;
      animation: particleBurst 0.8s ease-out forwards;
      animation-delay: 0.75s;
    }
    .particle:nth-child(1) { top: 0; left: 50%; transform: translate(-50%, 0); }
    .particle:nth-child(2) { top: 15%; right: 10%; }
    .particle:nth-child(3) { top: 50%; right: 0; transform: translate(0, -50%); }
    .particle:nth-child(4) { bottom: 15%; right: 10%; }
    .particle:nth-child(5) { bottom: 0; left: 50%; transform: translate(-50%, 0); }
    .particle:nth-child(6) { bottom: 15%; left: 10%; }
    .particle:nth-child(7) { top: 50%; left: 0; transform: translate(0, -50%); }
    .particle:nth-child(8) { top: 15%; left: 10%; }
    @keyframes particleBurst {
      0% { opacity: 1; transform: scale(1) translate(0,0); }
      100% { opacity: 0; transform: scale(0.3) translate(var(--tx, 0), var(--ty, 0)); }
    }
    .particle:nth-child(1) { --tx: 0px; --ty: -30px; }
    .particle:nth-child(2) { --tx: 22px; --ty: -22px; }
    .particle:nth-child(3) { --tx: 30px; --ty: 0px; }
    .particle:nth-child(4) { --tx: 22px; --ty: 22px; }
    .particle:nth-child(5) { --tx: 0px; --ty: 30px; }
    .particle:nth-child(6) { --tx: -22px; --ty: 22px; }
    .particle:nth-child(7) { --tx: -30px; --ty: 0px; }
    .particle:nth-child(8) { --tx: -22px; --ty: -22px; }

    /* Brand text */
    .brand-text {
      margin-top: 24px; opacity: 0; transform: translateY(16px);
      animation: textUp 0.5s ease forwards; animation-delay: 1s;
    }
    @keyframes textUp { to { opacity: 1; transform: translateY(0); } }
    .brand-name {
      font-size: 32px; font-weight: 700; color: var(--primary);
      letter-spacing: -0.5px;
    }
    .brand-tagline {
      font-size: 13px; color: #6B6B6B; margin-top: 6px; text-align: center;
      opacity: 0; animation: textUp 0.4s ease forwards; animation-delay: 1.3s;
    }

    /* Loading bar */
    .loading-bar {
      position: absolute; bottom: 100px; width: 120px; height: 3px;
      background: #EBEBEB; border-radius: 2px; overflow: hidden;
      opacity: 0; animation: textUp 0.3s ease forwards; animation-delay: 1.5s;
    }
    .loading-fill {
      height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 2px; width: 0%;
      animation: loadFill 1.5s ease-in-out forwards; animation-delay: 1.7s;
    }
    @keyframes loadFill { 0%{width:0%} 40%{width:60%} 70%{width:80%} 100%{width:100%} }

    /* Bottom text */
    .bottom-text {
      position: absolute; bottom: 50px; font-size: 11px; color: #9E9E9E;
      opacity: 0; animation: textUp 0.3s ease forwards; animation-delay: 1.6s;
    }

    /* Shimmer on logo */
    .logo-icon::after {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      border-radius: 28px;
      animation: shimmer 0.6s ease forwards; animation-delay: 1.2s;
    }
    @keyframes shimmer { 0%{left:-100%} 100%{left:100%} }
  </style>
</head>
<body>
<div class="device">

  <div class="bg-circle c1"></div>
  <div class="bg-circle c2"></div>

  <div class="logo-wrap">
    <div style="position:relative;display:flex;align-items:center;justify-content:center">
      <div class="particles">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
      </div>
      <div class="ring-burst"></div>
      <div class="logo-icon">
        <i class="ti ti-tools logo-inner" aria-hidden="true"></i>
      </div>
    </div>
    <div class="brand-text">
      <div class="brand-name">JASAne</div>
    </div>
    <div class="brand-tagline">Jasa rumah tangga, satu ketukan jari</div>
  </div>

  <div class="loading-bar">
    <div class="loading-fill"></div>
  </div>

  <div class="bottom-text">© 2026 JASAne · v1.0.0</div>

</div>
<script>
// Auto navigate to onboarding after splash animation
setTimeout(function() {
  window.location.href = 'jasane_onboarding_mockup.html';
}, 3500);
// Tap anywhere to skip
document.querySelector('.device').addEventListener('click', function() {
  window.location.href = 'jasane_onboarding_mockup.html';
});
</script>
</body>
</html>
